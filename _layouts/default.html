<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

	{%- include head.html -%}

	<body>
		{%- include header.html -%}

		<div class="sidebar-wrapper">
			{% include nav.html %}

			<!-- The content of the page -->
			<div class="container" id="content">
				{{ content }}
			</div>
		</div>

		{%- include footer.html -%}

		<!-- Optional JavaScript -->
		<!-- jQuery first, then Popper.js, then Bootstrap JS -->
		<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
		<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
		<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-MML-AM_CHTML' async></script>
		<!-- Mermaid Diagram Support -->
		<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
		<script type="text/javaScript">
			$(document).ready(function () {
				$('#sidebarToggle').on('click', function() {
					$('#sidebar').toggleClass('active');
				});

				// Convert fenced mermaid code blocks to Mermaid containers before rendering.
				document.querySelectorAll('code.language-mermaid').forEach(function(code) {
					var pre = code.closest('pre');
					if (!pre) {
						return;
					}

					var mermaidDiv = document.createElement('div');
					mermaidDiv.className = 'mermaid';
					mermaidDiv.textContent = code.textContent;

					var container = pre;
					if (container.parentElement && container.parentElement.classList.contains('highlight')) {
						container = container.parentElement;
					}
					if (container.parentElement && container.parentElement.classList.contains('highlighter-rouge')) {
						container = container.parentElement;
					}

					container.replaceWith(mermaidDiv);
				});

				if (typeof mermaid !== 'undefined') {
					mermaid.initialize({ startOnLoad: false });
					mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
				}
			});
		</script>
	</body>
</html>
